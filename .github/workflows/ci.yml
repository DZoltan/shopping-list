name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Schema and migrations in sync
        run: npx drizzle-kit generate | tee /dev/stderr | grep -q "No schema changes"

      - name: Build
        run: npm run build

      # Starts its own dev server with a throwaway local D1 (Miniflare); no Cloudflare account needed
      - name: End-to-end tests
        run: npm run test:e2e
